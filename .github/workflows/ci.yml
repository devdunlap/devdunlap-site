name: CI

# Simple, interview-friendly pipeline for a no-build static site:
#   1. site-checks  — structure, links, accessibility basics, security
#                     hygiene and a page-weight budget (scripts/check_site.py)
#   2. terraform    — the Cloudflare infrastructure as code is formatted
#                     and valid (infra/)
#   Deployments live in blue-green.yml (manual, slot-based).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run — CI minutes are
# not spent validating code nobody is looking at anymore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-checks:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run site checks
        run: python3 scripts/check_site.py

  terraform:
    name: Terraform IaC checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -diff -recursive

      - name: Init (no backend, no credentials)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
